name: Example2 workflow
on: push
jobs:
  script_runner_job: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: List all files
        run: ls -la

      - name: Run script
        run: | 
          chmod +x .github/workflows/script_runner.sh
          .github/workflows/script_runner.sh
